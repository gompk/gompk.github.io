<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvID - Field ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --bg-2: #edeff8;
    --surface: #ffffff;
    --surface-2: #f3eef8;
    --line: #ddd7ea;
    --paper: #1e2350;
    --ink: #ffffff;
    --muted: #767aa0;
    --gold: #3454d1;
    --gold-dim: #b9c4f2;
    --yellow: #f0c419;
    --yellow-dim: #050401;
    --yellow-bg: rgba(240,196,25,0.22);
    --green: #2f9e44;
    --green-dim: #1a5c27;
    --green-bg: rgba(47,158,68,0.20);
    --teal-bg: rgba(160,111,214,0.20);
    --teal-dim: #5a3684;
    --leaf-bg: rgba(52,84,209,0.18);
    --leaf-dim: #1e2350;
    --rust: #c23a72;
    --teal: #a06fd6;
    --leaf: #3454d1;
    --danger: #b3123f;
    --radius: 3px;
    --font-display: 'Fraunces', serif;
    --font-body: 'Arial', serif;
    --font-mono: 'Courier Prime', monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(52,84,209,0.06), transparent 40%),
      var(--bg);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    background-image:
      repeating-radial-gradient(circle at 50% 0%, transparent 0, transparent 68px, rgba(214,65,126,0.03) 69px, transparent 70px),
      var(--bg);
    background-attachment: fixed;
  }

  a{ color: var(--gold); }

  ::selection{ background: var(--gold); color: var(--ink); }

  /* ---------- layout ---------- */
  .wrap{
    margin-left: 60vw;
    width: 40vw;
    max-width: none;
    padding: 14px 20px 32px;
    box-sizing: border-box;
  }

  /* ---------- header bar ---------- */
  .header-bar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .header-controls{
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  main.grid{
    display: block;
  }
  .left-col{
    position: fixed;
    top: 0;
    left: 0;
    width: 60vw;
    height: 100vh;
    z-index: 5;
  }
  @media (max-width: 860px){
    .wrap{ margin-left: 0; width: 100%; }
    .left-col{ position: static; width: auto; height: auto; }
    .photo-frame{ height: min(48vh, 480px) !important; }
    .photo-card.revealed .photo-frame{ height: min(52vh, 520px) !important; }
  }
  .right-col{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .app-title{
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(22px, 2.4vw, 28px);
    font-weight: 400;
    color: var(--paper);
    letter-spacing: -0.01em;
  }
  .app-title em{
    font-style: italic;
    color: var(--gold);
    font-weight: 400;
  }
  .app-title b{
    font-weight: 700;
    color: var(--paper);
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  /* ---------- photo card ---------- */
  .photo-card{
    position: relative;
    overflow: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 0;
    border-width: 0 1px 0 0;
  }
  @media (max-width: 860px){
    .photo-card{ height: auto; border-radius: var(--radius); border-width: 1px; }
  }
  .photo-frame{
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
    background: var(--bg-2);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: height 0.35s ease;
  }

  .pick-corner{
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 6;
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.88);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--gold);
    backdrop-filter: blur(3px);
  }
  .pick-corner svg{ width: 17px; height: 17px; display: block; }
  .pick-corner:hover:not(:disabled){
    background: #ffffff;
    border-color: var(--gold);
  }
  .pick-corner:disabled{ opacity: 0.4; cursor: not-allowed; }
  .sound-corner{
    position: absolute;
    top: 14px;
    right: 62px;
    z-index: 6;
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.88);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--gold);
    backdrop-filter: blur(3px);
  }
  .sound-corner svg{ width: 17px; height: 17px; display: block; }
  .sound-corner:hover:not(:disabled){
    background: #ffffff;
    border-color: var(--gold);
  }
  .sound-corner:disabled{ opacity: 0.4; cursor: not-allowed; }
  .sound-corner.is-playing{ color: #ffffff; background: var(--gold); border-color: var(--gold); }
  .sound-corner.is-loading svg{ animation: spin 1s linear infinite; }
  @keyframes spin{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
  .photo-card.revealed .photo-frame{
    flex: 1;
  }
  .photo-frame img{
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display:block;
    margin: auto;
    animation: fadein 0.5s ease;
  }
  @keyframes fadein{ from{ opacity:0 } to{ opacity: 1 } }

  .skeleton{
    position:absolute; inset:0;
    background: linear-gradient(100deg, var(--bg-2) 30%, #ffffff 50%, var(--bg-2) 70%);
    background-size: 250% 100%;
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer{ 0%{ background-position: 150% 0 } 100%{ background-position: -50% 0 } }

  .photo-credit{
    display:flex;
    justify-content: space-between;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    padding: 9px 14px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .photo-credit a{ color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .photo-credit a:hover{ color: var(--gold); }

  /* ---------- guess panel ---------- */
  .guess-panel{ padding: 14px; }
  .guess-panel h2{
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--leaf);
    margin: 0 0 10px;
  }

  .guess-row{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .guess-row input{
    flex: 1;
    min-width: 160px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--paper);
    padding: 12px 13px;
    font-size: 15px;
    font-family: var(--font-body);
  }
  .guess-row input:focus{ outline: 2px solid var(--gold); outline-offset: -1px; }
  .guess-row input::placeholder{ color: #9a9ec4; }

  button{
    font-family: var(--font-body);
    font-size: 12.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--paper);
    padding: 12px 16px;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled){ border-color: var(--gold); }
  button:active:not(:disabled){ transform: translateY(1px); }
  button:disabled{ opacity: 0.45; cursor: not-allowed; }

  button.primary{
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
    font-weight: 600;
  }
  button.primary:hover:not(:disabled){ background: #5a76e0; }

  button.ghost{
    background: transparent;
    color: var(--muted);
  }

  #advanceBtn{
    white-space: nowrap;
    width: 150px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
    border-width: 1px;
  }
  #advanceBtn.is-reveal:not(:disabled){
    background: #14161c;
    border-color: #14161c;
    color: #ffffff;
    font-weight: 600;
  }
  #advanceBtn.is-reveal:not(:disabled):hover{
    background: #23262f;
    border-color: #23262f;
  }
  #advanceBtn.is-next:not(:disabled){
    background: #14161c;
    border-color: #14161c;
    color: #ffffff;
    font-weight: 600;
  }
  #advanceBtn.is-next:not(:disabled):hover{
    background: #23262f;
    border-color: #23262f;
  }

  .panel-foot{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 12px;
    gap: 10px;
    flex-wrap: wrap;
  }

  .hint{ font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* ---------- feed ---------- */
  .feed{
    list-style: none;
    margin: 14px 0 0;
    padding: 0;
    display:flex;
    flex-direction: column;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
  }
  .feed li{
    display:flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-left: 4px solid var(--muted);
    border-radius: var(--radius);
    padding: 9px 11px;
    font-size: 13px;
    animation: slidein 0.25s ease;
  }
  @keyframes slidein{ from{ opacity:0; transform: translateY(-6px);} to{ opacity:1; transform:none; } }
  .feed li.s-100{
    border-left-color: var(--yellow);
    border-left-width: 5px;
    background: var(--yellow-bg);
  }
  .feed li.s-100 .fm b{ color: var(--yellow-dim); }
  .feed li.s-hi{ border-left-color: var(--leaf); }
  .feed li.s-genus{ border-left-color: var(--green); }
  .feed li.s-mid{ border-left-color: var(--teal); }
  .feed li.s-lo{ border-left-color: var(--rust); }
  .feed li.s-none{ border-left-color: var(--danger); }
  .feed li.s-echo{ border-left-color: var(--teal); border-left-style: dashed; }
  .feed li.s-echo.tier-order{ border-left-color: var(--teal); }
  .feed li.s-echo.tier-family{ border-left-color: var(--leaf); }
  .feed li.s-echo.tier-genus{ border-left-color: var(--green); }
  .feed li.s-echo.tier-species{ border-left-color: var(--yellow); }
  .feed li.has-echo{
    align-items: flex-start;
    border-left-width: 5px;
    animation: slidein 0.25s ease, echoPulse 1.2s ease 0.2s;
  }
  @keyframes echoPulse{
    0%{ box-shadow: 0 0 0 0 rgba(52,84,209,0.35); }
    55%{ box-shadow: 0 0 0 8px rgba(52,84,209,0); }
    100%{ box-shadow: 0 0 0 0 rgba(52,84,209,0); }
  }
  .feed .fq{ color: var(--muted); flex: 0 0 auto; font-family: var(--font-body); font-size: 11px; }
  .feed .fm{ flex: 1; }
  .feed .fm b{ color: var(--paper); }
  .echo-line{
    display: block;
    margin-top: 5px;
    color: var(--paper);
    font-weight: 500;
  }
  .echo-badge{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--muted);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
    margin-right: 6px;
    white-space: nowrap;
    vertical-align: middle;
  }
  .echo-mark{
    background: var(--muted);
    color: var(--ink);
    font-weight: 700;
    font-style: normal;
    font-family: var(--font-body);
    font-size: 0.9em;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .echo-badge.tier-order, .echo-mark.tier-order{ background: var(--teal); color: #ffffff; }
  .echo-badge.tier-family, .echo-mark.tier-family{ background: var(--leaf); color: #ffffff; }
  .echo-badge.tier-genus, .echo-mark.tier-genus{ background: var(--green); color: #ffffff; }
  .echo-badge.tier-species, .echo-mark.tier-species{ background: var(--yellow); color: #050401; }
  .echo-mark.tier-order{ box-shadow: 0 0 0 1px rgba(160,111,214,0.5); }
  .echo-mark.tier-family{ box-shadow: 0 0 0 1px rgba(52,84,209,0.5); }
  .echo-mark.tier-genus{ box-shadow: 0 0 0 1px rgba(47,158,68,0.5); }
  .echo-mark.tier-species{ box-shadow: 0 0 0 1px rgba(240,196,25,0.6); }

  /* ---------- ladder / cladogram ---------- */
  .ladder-card{ padding: 16px 16px 18px; position: sticky; top: 16px; }
  .ladder-card h2{
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--leaf);
    margin: 0 0 4px;
  }
  .best-line{
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
    min-height: 16px;
  }
  .best-line b{ color: var(--gold); }

  .ladder{
    display: flex;
    flex-direction: column;
  }

  .rung{
    position: relative;
    display: flex;
    gap: 12px;
    padding: 7px 4px 7px 0;
    cursor: default;
  }
  .rung.revealed{ cursor: pointer; }

  .tier-grid{
    position: absolute;
    inset: 0;
    display: grid;
    gap: 0;
    background: var(--bg-2);
    animation: fadein 0.2s ease;
  }
  .tier-grid img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tier-grid-label{
    position: absolute;
    left: 14px;
    bottom: 14px;
    z-index: 2;
    background: rgba(20,20,30,0.72);
    backdrop-filter: blur(3px);
    color: #fff;
    font-family: var(--font-body);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: var(--radius);
    pointer-events: none;
  }
  .tier-grid-label i{ opacity: 0.75; margin-left: 5px; }

  .rung-marker{
    flex: 0 0 16px;
    width: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .rung-marker .dot{
    flex: 0 0 auto;
    width: 9px; height: 9px;
    margin-top: 5px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--muted);
    transition: all 0.3s;
  }
  .rung-marker .tick{
    flex: 1 1 auto;
    width: 1px;
    min-height: 10px;
    margin-top: 3px;
    background: var(--line);
    opacity: 0.55;
  }
  .rung:last-child .rung-marker .tick{ display: none; }

  .rung.revealed .rung-marker .dot{
    border-color: var(--gold);
    background: var(--gold);
    box-shadow: 0 0 0 3px rgba(52,84,209,0.18);
  }
  .rung.revealed .rung-marker .tick{ background: var(--gold-dim); opacity: 0.85; }

  .rung.revealed.auto .rung-marker .dot{
    background: transparent;
    border-color: var(--muted);
    border-style: dashed;
    box-shadow: none;
  }
  .rung.revealed.auto .rung-marker .tick{ background: var(--line); opacity: 0.55; }
  .rung.revealed.auto .rk-name{ color: #9498b8; }
  .rung.revealed.auto .rk-common{ color: var(--muted); }

  .rung-body{
    flex: 1 1 auto;
    min-width: 0;
    padding-bottom: 2px;
  }
  .rung-top{
    display: flex;
    align-items: baseline;
    gap: 7px;
    flex-wrap: wrap;
  }

  .rung .rk-flag{
    display: none;
    font-family: var(--font-body);
    font-size: 8.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    vertical-align: middle;
  }
  .rung.revealed.auto .rk-flag{ display: inline-block; }

  .rung .rk-label{
    font-family: var(--font-body);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    display:block;
    margin-bottom: 2px;
  }
  .rung .rk-name{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 16px;
    color: #4c5286;
    transition: color 0.2s;
  }
  .rung .rk-common{
    font-size: 11.5px;
    color: var(--muted);
    display: block;
    margin-top: 1px;
    min-height: 14px;
  }
  .rung.revealed .rk-name{ color: var(--paper); }
  .rung.revealed .rk-common{ color: var(--leaf); }

  .rung.order-hit .rung-marker .dot{
    border-color: var(--teal);
    background: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-bg);
  }
  .rung.order-hit .rung-marker .tick{ background: var(--teal); opacity: 0.85; }
  .rung.order-hit .rung-body{
    background: var(--teal-bg);
    border-radius: var(--radius);
    padding: 4px 8px;
    margin: -4px -8px;
  }
  .rung.order-hit .rk-name{ color: var(--teal-dim); }
  .rung.order-hit .rk-common{ color: var(--teal-dim); }

  .rung.family-hit .rung-marker .dot{
    border-color: var(--leaf);
    background: var(--leaf);
    box-shadow: 0 0 0 3px var(--leaf-bg);
  }
  .rung.family-hit .rung-marker .tick{ background: var(--leaf); opacity: 0.85; }
  .rung.family-hit .rung-body{
    background: var(--leaf-bg);
    border-radius: var(--radius);
    padding: 4px 8px;
    margin: -4px -8px;
  }
  .rung.family-hit .rk-name{ color: var(--leaf-dim); }
  .rung.family-hit .rk-common{ color: var(--leaf-dim); }

  .rung.genus-hit .rung-marker .dot{
    border-color: var(--green);
    background: var(--green);
    box-shadow: 0 0 0 3px var(--green-bg);
  }
  .rung.genus-hit .rung-marker .tick{ background: var(--green); opacity: 0.85; }
  .rung.genus-hit .rung-body{
    background: var(--green-bg);
    border-radius: var(--radius);
    padding: 4px 8px;
    margin: -4px -8px;
  }
  .rung.genus-hit .rk-name{ color: var(--green-dim); }
  .rung.genus-hit .rk-common{ color: var(--green-dim); }

  .rung.species-hit .rung-marker .dot{
    border-color: var(--yellow);
    background: var(--yellow);
    box-shadow: 0 0 0 3px var(--yellow-bg);
  }
  .rung.species-hit .rung-marker .tick{ background: var(--yellow); opacity: 0.85; }
  .rung.species-hit .rung-body{
    background: var(--yellow-bg);
    border-radius: var(--radius);
    padding: 4px 8px;
    margin: -4px -8px;
  }
  .rung.species-hit .rk-name{ color: var(--yellow-dim); }
  .rung.species-hit .rk-common{ color: var(--yellow-dim); }

  /* ---------- solution folded panel ---------- */
  .reveal-details{
    margin-top: 16px;
    border-top: 1px dashed var(--line);
    display: none;
  }
  .reveal-details.show{
    display: block;
  }
  .reveal-details summary{
    padding: 12px 8px;
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    cursor: pointer;
    user-select: none;
    outline: none;
    transition: color 0.15s;
    list-style: none; /* Hide default arrow in webkit */
  }
  .reveal-details summary::-webkit-details-marker {
    display: none;
  }
  .reveal-details summary::before {
    content: "► ";
    display: inline-block;
    margin-right: 4px;
    transition: transform 0.2s;
  }
  .reveal-details[open] summary::before {
    transform: rotate(90deg);
  }
  .reveal-details summary:hover{
    color: #3454d1;
  }

  .reveal-box{
    padding-top: 8px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
  }
  .reveal-box a{ text-decoration: underline; text-underline-offset: 2px; }

  .reveal-score{
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .reveal-score b{ color: var(--gold); }

  .reveal-headline{
    margin-bottom: 14px;
  }
  .reveal-headline .rh-name{
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--paper);
    line-height: 1.3;
  }
  .reveal-headline .rh-sci{
    font-style: italic;
    color: var(--leaf);
    font-size: 13px;
  }
  .reveal-section{ margin-top: 14px; }
  .reveal-section h3{
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;

<body>
<div class="wrap">

  <header class="header-bar">
    <h1 class="app-title"><em>Av</em><b>ID</b></h1>

    <div class="header-controls">
      <div class="gamemode-row">
        <label for="gamemodeSelect">Mode</label>

      </div>

      <div class="difficulty-row">
        <label for="difficultySlider">Difficulty</label>
        <span class="diff-end">Common</span>
        <input type="range" id="difficultySlider" min="0" max="100" step="1" value="50">

  <div class="err-banner" id="errBanner"></div>

  <main class="grid">

          <svg id="soundBtnIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 9v6h4l5 5V4L8 9H4z"></path>
            <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"></path>
            <path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"></path>
          </svg>
        </button>
        <button class="pick-corner" id="pickBtn" disabled title="Pick me — multiple choice" aria-label="Pick me — multiple choice">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="2" y="2" width="5.5" height="5.5" rx="1"></rect>
            <rect x="9.25" y="2" width="5.5" height="5.5" rx="1"></rect>
            <rect x="16.5" y="2" width="5.5" height="5.5" rx="1"></rect>
            <rect x="2" y="9.25" width="5.5" height="5.5" rx="1"></rect>
            <rect x="9.25" y="9.25" width="5.5" height="5.5" rx="1"></rect>
            <rect x="16.5" y="9.25" width="5.5" height="5.5" rx="1"></rect>
            <rect x="2" y="16.5" width="5.5" height="5.5" rx="1"></rect>

        <!-- Collapsible solution panel -->
        <details class="reveal-details" id="revealDetails" open>

  <div class="pick-overlay" id="pickOverlay">

      <div class="pick-foot">

      </div>

<script>
(function(){
  "use strict";

  const API = "https://api.inaturalist.org/v1";
  const params = new URLSearchParams(location.search);

  // ---------- gamemodes (taxonomic clade filters) ----------
  // Each mode maps to one or more iNaturalist order-level taxon IDs
  // (comma-separated where a birder's grouping spans several taxonomic orders).
  const GAMEMODES = [
    { id: "all", label: "All birds", q: "3" }, // Aves
    { id: "seabirds", label: "Seabirds & shorebirds", q: "67561,67565,71268" }, // Charadriiformes, Procellariiformes, Suliformes
    { id: "waterbirds", label: "Waterbirds", q: "6888,67566,67562,67563" }, // Anseriformes, Pelecaniformes, Gaviiformes, Podicipediformes
    { id: "raptors", label: "Raptors", q: "71261,67570,19350" }, // Accipitriformes, Falconiformes, Strigiformes
    { id: "songbirds", label: "Songbirds", q: "7251" }, // Passeriformes
  ];
  const urlTaxonId = params.get("taxon_id");
  let gamemode = urlTaxonId ? null : (GAMEMODES.find(m => m.id === params.get("mode")) || GAMEMODES[0]);
  let cladeId = urlTaxonId || gamemode.q; // 3 = Aves (birds) by default

  let placeId = params.get("place_id") || null;

  const REGIONS = [
    { label: "🌍 Everywhere", q: null },
    { label: "North America", q: "North America" },
    { label: "South America", q: "South America" },
    { label: "Europe", q: "Europe" },
    { label: "Africa", q: "Africa" },
    { label: "Asia", q: "Asia" },
    { label: "Oceania", q: "Oceania" },
    { label: "Australia", q: "Australia" },
    { label: "United States", q: "United States" },
    { label: "Canada", q: "Canada" },
    { label: "United Kingdom", q: "United Kingdom" },
    { label: "Mexico", q: "Mexico" },
    { label: "Brazil", q: "Brazil" },
    { label: "India", q: "India" },
    { label: "Japan", q: "Japan" },
    { label: "New Zealand", q: "New Zealand" },
    { label: "South Africa", q: "South Africa" },
  ];
  const placeIdCache = {};

  const RANKS = ["kingdom","phylum","class","order","family","genus","species"];
  const RANK_LABELS = { kingdom:"Kingdom", phylum:"Phylum", class:"Class", order:"Order", family:"Family", genus:"Genus", species:"Species" };

  // ---------- state ----------
  let state = null;
  let mysteryFrameHTML = "";
  let hoverToken = 0;
  const taxonPhotoCache = {};
  const taxonPhotoResolved = {};
  let soundToken = 0;
  let currentAudio = null;

  const el = {
    photoCard: document.querySelector(".photo-card"),
    photoFrame: document.getElementById("photoFrame"),
    skeleton: document.getElementById("skeleton"),
    creditText: document.getElementById("creditText"),
    creditLink: document.getElementById("creditLink"),
    guessInput: document.getElementById("guessInput"),
    guessBtn: document.getElementById("guessBtn"),
    pickBtn: document.getElementById("pickBtn"),
    soundBtn: document.getElementById("soundBtn"),
    soundBtnIcon: document.getElementById("soundBtnIcon"),
    advanceBtn: document.getElementById("advanceBtn"),
    pickOverlay: document.getElementById("pickOverlay"),
    pickPhotoImg: document.getElementById("pickPhotoImg"),
    pickTitle: document.getElementById("pickTitle"),
    pickEyebrow: document.getElementById("pickEyebrow"),
    pickSupraclade: document.getElementById("pickSupraclade"),
    pickBody: document.getElementById("pickBody"),
    pickProgress: document.getElementById("pickProgress"),
    pickCloseBtn: document.getElementById("pickCloseBtn"),
    pickRevealBtn: document.getElementById("pickRevealBtn"),
    feed: document.getElementById("feed"),
    ladder: document.getElementById("ladder"),
    bestLine: document.getElementById("bestLine"),
    revealDetails: document.getElementById("revealDetails"),
    revealSummary: document.getElementById("revealSummary"),
    revealBox: document.getElementById("revealBox"),
    errBanner: document.getElementById("errBanner"),
    hintText: document.getElementById("hintText"),
    gamemodeSelect: document.getElementById("gamemodeSelect"),
    regionSelect: document.getElementById("regionSelect"),
    regionStatus: document.getElementById("regionStatus"),
    difficultySlider: document.getElementById("difficultySlider"),
    difficultyLabel: document.getElementById("difficultyLabel"),
  };

  // difficulty: 0 = easiest, 100 = hardest, 50 = neutral.
  let difficulty = Number(el.difficultySlider.value) || 50;
  const speciesPoolCache = {};

  function showError(msg){
    el.errBanner.textContent = msg;
    el.errBanner.classList.add("show");
  }
  function clearError(){ el.errBanner.classList.remove("show"); }

  function rnd(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr){ return arr[rnd(0, arr.length - 1)]; }

  async function fetchJSON(url, opts){
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);
    try{
      const fetchOpts = Object.assign({ signal: controller.signal }, opts || {});
      const res = await fetch(url, fetchOpts);
      if(!res.ok) throw new Error("Request failed (" + res.status + ")");
      return await res.json();
    }finally{
      clearTimeout(timeoutId);
    }
  }

  // ---------- fetching a random bird observation ----------

  async function fetchRandomObservationUniform(attempt){
    attempt = attempt || 0;
    const orderBys = ["votes","observed_on","created_at","id","random"];
    const maxPage = attempt < 2 ? 45 : 10;
    const page = rnd(1, maxPage);
    const qs = new URLSearchParams({
      taxon_id: cladeId,
      photos: "true",
      quality_grade: "research",
      per_page: "30",
      page: String(page),
      order_by: pick(orderBys),
      order: pick(["desc","asc"]),
    });
    if(placeId) qs.set("place_id", placeId);
    const data = await fetchJSON(`${API}/observations?${qs.toString()}`);
    const results = (data.results || []).filter(o =>
      o.taxon && o.photos && o.photos.length > 0 &&
      (attempt >= 3 || o.taxon.rank === "species")
    );
    if(results.length === 0){
      if(attempt >= 6) throw new Error("Couldn't find any observations for this clade.");
      return fetchRandomObservationUniform(attempt + 1);
    }
    return pick(results);
  }

  async function fetchSpeciesPool(){
    const cacheKey = `${cladeId}:${placeId || ""}`;
    if(speciesPoolCache[cacheKey]) return speciesPoolCache[cacheKey];
    const qs = new URLSearchParams({
      taxon_id: cladeId,
      photos: "true",
      quality_grade: "research",
      hrank: "species",
      lrank: "species",
      per_page: "500",
    });
    if(placeId) qs.set("place_id", placeId);
    const data = await fetchJSON(`${API}/observations/species_counts?${qs.toString()}`);
    const pool = (data.results || []).filter(r => r.taxon && r.count > 0);
    speciesPoolCache[cacheKey] = pool;
    return pool;
  }

  function pickWeightedSpecies(pool, diff){
    const k = (50 - diff) / 50; // +1 .. 0 .. -1
    const weights = pool.map(r => Math.pow(Math.max(r.count, 1), k));
    const total = weights.reduce((a, b) => a + b, 0);
    if(!(total > 0)) return pick(pool);
    let r = Math.random() * total;
    for(let i = 0; i < pool.length; i++){
      r -= weights[i];
      if(r <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  async function fetchObservationsForTaxon(taxonId){
    const qs = new URLSearchParams({
      taxon_id: String(taxonId),
      photos: "true",
      quality_grade: "research",
      per_page: "30",
      order_by: pick(["votes", "observed_on", "created_at", "id"]),
      order: pick(["desc", "asc"]),
    });
    if(placeId) qs.set("place_id", placeId);
    const data = await fetchJSON(`${API}/observations?${qs.toString()}`);
    return (data.results || []).filter(o => o.taxon && o.photos && o.photos.length > 0);
  }

  async function fetchRandomObservation(attempt){
    attempt = attempt || 0;
    if(difficulty === 50) return fetchRandomObservationUniform();

    try{
      const pool = await fetchSpeciesPool();
      if(!pool.length) return fetchRandomObservationUniform();

      const maxTries = Math.min(5, pool.length);
      const tried = new Set();
      const candidates = [];
      while(candidates.length < maxTries){
        const candidate = pickWeightedSpecies(pool, difficulty);
        if(tried.has(candidate.taxon.id)) continue;
        tried.add(candidate.taxon.id);
        candidates.push(candidate);
      }

      // These lookups don't depend on each other — fire them all at once
      // instead of waiting on each in turn, so a round load takes as long
      // as the slowest of the five rather than the sum of all five.
      const settled = await Promise.allSettled(
        candidates.map(c => fetchObservationsForTaxon(c.taxon.id))
      );
      for(const result of settled){
        if(result.status === "fulfilled" && result.value.length) return pick(result.value);
      }
      return fetchRandomObservationUniform();
    }catch(e){
      console.error(e);
      return fetchRandomObservationUniform();
    }
  }

  async function fetchTaxonDetail(taxonId){
    const data = await fetchJSON(`${API}/taxa/${taxonId}`);
    if(!data.results || !data.results.length) throw new Error("Taxon lookup failed.");
    return data.results[0];
  }

  // ---------- calls/songs ----------
  // Sources, tried in order, best quality first:
  //
  // 1. Xeno-canto, quality-filtered to grade A only (their top community
  //    rating band). Requires a per-account key (as of Oct 2025), which is
  //    what makes this filterable at all — GBIF/ML have no rating field to
  //    query on.
  // 2. Macaulay Library, via GBIF — ML publishes its own curated archive to
  //    GBIF as its own dataset (doi.org/10.15468/ckcdpy), separate from the
  //    Xeno-canto and iNaturalist datasets GBIF also aggregates. Filtering
  //    to just that datasetKey gets us ML's own recordings — the same
  //    archive https://search.macaulaylibrary.org browses — without
  //    Xeno-canto's noisier crowd-sourced clips or iNaturalist's casual
  //    phone recordings diluting the pool. There's no key-free public API
  //    for search.macaulaylibrary.org itself (it's a logged-in, browser-only
  //    search UI with CSV export), so this is the closest open equivalent.
  //    Used only if XC has no grade-A recording for the species.
  // 3. GBIF, unfiltered — same endpoint, any publisher (Xeno-canto,
  //    iNaturalist, etc). Used only if the above two have nothing.
  // 4. iNaturalist's own observations with attached audio. Thinnest pool,
  //    last resort.
  //
  // NOTE ON THE KEY BELOW: it's hardcoded here at the person's request, but
  // that means it's visible to anyone who views this page's source. If this
  // file is ever shared or hosted publicly, swap it for a prompt/localStorage
  // value instead so the key isn't handed out with the file.
  const XC_API_KEY = "38aa2dc67b19a3aad1a27589f0031799f9ab6b7f";
  const ML_GBIF_DATASET_KEY = "7f6dd0f7-9ed4-49c0-bb71-b2a9c7fed9f1"; // Macaulay Library Audio and Video Collection

  function xcAbsUrl(u){
    if(!u) return null;
    return u.startsWith("//") ? `https:${u}` : u;
  }

  async function fetchBirdSoundXC(scientificName){
    const qs = new URLSearchParams({
      query: `sp:"${scientificName}" q:A`,
      key: XC_API_KEY,
      per_page: "50",
    });
    const data = await fetchJSON(`https://xeno-canto.org/api/3/recordings?${qs.toString()}`, { priority: "low" });
    const candidates = (data.recordings || [])
      .filter(r => r.file)
      .map(r => ({
        url: xcAbsUrl(r.file),
        recordist: r.rec || "unknown recordist",
        uri: xcAbsUrl(r.url),
        publisher: "Xeno-canto",
      }));
    for(let i = candidates.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    return candidates.slice(0, 8);
  }

  async function fetchBirdSoundGBIF(scientificName, datasetKey){
    const qs = new URLSearchParams({
      scientificName,
      mediaType: "Sound",
      limit: "50",
    });
    if(datasetKey) qs.set("datasetKey", datasetKey);
    const data = await fetchJSON(`https://api.gbif.org/v1/occurrence/search?${qs.toString()}`, { priority: "low" });
    const candidates = [];
    for(const occ of (data.results || [])){
      for(const m of (occ.media || [])){
        if(m.type === "Sound" && m.identifier){
          candidates.push({
            url: m.identifier,
            recordist: occ.recordedBy || m.rightsHolder || "unknown recordist",
            uri: m.references || occ.occurrenceID || null,
            publisher: occ.publisher || occ.institutionCode || (datasetKey === ML_GBIF_DATASET_KEY ? "Macaulay Library" : null),
          });
        }
      }
    }
    // Shuffle a bit so repeated rounds for the same species don't always
    // surface the same clip, then cap the candidate list — playback will
    // try these in order and fall through if one fails to load.
    for(let i = candidates.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    return candidates.slice(0, 8);
  }

  // Last-resort fallback: iNaturalist's own observations, filtered to ones
  // that carry audio. Public, documented, no key required — but iNat's own
  // audio coverage is much thinner than GBIF's aggregated pool, so this only
  // gets used when GBIF (Macaulay-only and unfiltered) both turn up nothing.
  async function fetchBirdSoundINat(taxonId){
    async function query(qualityGrade){
      const qs = new URLSearchParams({
        taxon_id: taxonId,
        sounds: "true",
        per_page: "10",
        order_by: "votes",
        order: "desc",
      });
      if(qualityGrade) qs.set("quality_grade", qualityGrade);
      const data = await fetchJSON(`${API}/observations?${qs.toString()}`, { priority: "low" });
      return (data.results || []).filter(o => o.sounds && o.sounds.length);
    }
    let results = await query("research");
    if(!results.length) results = await query(null);
    return results.slice(0, 5).map(pick => ({
      url: pick.sounds[0].file_url,
      recordist: (pick.user && (pick.user.name || pick.user.login)) || "unknown recordist",
      uri: pick.uri || `https://www.inaturalist.org/observations/${pick.id}`,
      publisher: "iNaturalist",
    })).filter(c => c.url);
  }

  async function fetchBirdSound(taxonId, scientificName){
    try{
      const xcCandidates = await fetchBirdSoundXC(scientificName);
      if(xcCandidates.length) return xcCandidates;
    }catch(e){
      console.error("Xeno-canto sound lookup failed", e);
    }
    try{
      const mlCandidates = await fetchBirdSoundGBIF(scientificName, ML_GBIF_DATASET_KEY);
      if(mlCandidates.length) return mlCandidates;
    }catch(e){
      console.error("Macaulay Library (GBIF) sound lookup failed", e);
    }
    try{
      const gbifCandidates = await fetchBirdSoundGBIF(scientificName);
      if(gbifCandidates.length) return gbifCandidates;
    }catch(e){
      console.error("GBIF sound lookup failed", e);
    }
    try{
      return await fetchBirdSoundINat(taxonId);
    }catch(e){
      console.error("iNat sound lookup failed", e);
      return [];
    }
  }

  function stopBirdSound(){
    if(currentAudio){
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    el.soundBtn.classList.remove("is-playing");
  }

  function setSoundButtonState(mode){
    // mode: "loading" | "ready" | "playing" | "none"
    el.soundBtn.classList.toggle("is-loading", mode === "loading");
    el.soundBtn.classList.toggle("is-playing", mode === "playing");
    el.soundBtn.disabled = mode === "loading" || mode === "none";
    if(mode === "none") el.soundBtn.title = "No recordings with audio found";
    else if(mode === "loading") el.soundBtn.title = "Loading call/song…";
    else if(mode === "playing") el.soundBtn.title = "Pause";
    else el.soundBtn.title = "Play call/song";
  }

  async function loadSoundForRound(taxonId, scientificName){
    const myToken = ++soundToken;
    state.sound = null;
    setSoundButtonState("loading");
    try{
      const candidates = await fetchBirdSound(taxonId, scientificName);
      if(myToken !== soundToken) return; // superseded by a newer round
      state.sound = candidates.length ? { candidates, index: 0 } : null;
      setSoundButtonState(state.sound ? "ready" : "none");
      if(state.finished) refreshRevealSoundLine();
    }catch(e){
      if(myToken !== soundToken) return;
      console.error(e);
      setSoundButtonState("none");
    }
  }

  function playCurrentSoundCandidate(){
    const sound = state.sound;
    const candidate = sound.candidates[sound.index];
    currentAudio = new Audio(candidate.url);
    currentAudio.addEventListener("ended", () => setSoundButtonState("ready"));
    currentAudio.addEventListener("error", () => {
      // This clip failed to load (some aggregated records point at a
      // non-audio landing page rather than a raw file) — try the next
      // candidate before giving up entirely.
      sound.index += 1;
      if(sound.index < sound.candidates.length){
        if(state.finished) refreshRevealSoundLine();
        playCurrentSoundCandidate();
      }else{
        setSoundButtonState("none");
        if(state.finished) refreshRevealSoundLine();
      }
    });
    currentAudio.play().then(() => setSoundButtonState("playing")).catch(() => setSoundButtonState("none"));
  }

  function toggleBirdSound(){
    if(!state || !state.sound) return;
    if(currentAudio && !currentAudio.paused){
      stopBirdSound();
      setSoundButtonState("ready");
      return;
    }
    playCurrentSoundCandidate();
  }

  function buildChain(taxonDetail){
    const all = (taxonDetail.ancestors || []).concat(taxonDetail).map(a => ({
      id: a.id, name: a.name, rank: a.rank, common: a.preferred_common_name || null
    }));
    const map = new Map();
    all.forEach(item => {
      if(RANKS.includes(item.rank) && !map.has(item.rank)){
        map.set(item.rank, item);
      }
    });
    return RANKS.map(r => map.get(r)).filter(Boolean);
  }

  function buildFullByRank(taxonDetail){
    const all = (taxonDetail.ancestors || []).concat(taxonDetail);
    const map = {};
    all.forEach(item => {
      if(RANKS.includes(item.rank) && !map[item.rank]) map[item.rank] = item;
    });
    return map;
  }

  function photoUrl(obs){
    const p = obs.photos && obs.photos[0];
    if(!p) return null;
    let url = p.url || p.medium_url || p.large_url;
    if(!url) return null;
    return url.replace(/square\.(jpg|jpeg|png|gif)/i, "large.$1");
  }

  // ---------- round lifecycle ----------
  let roundToken = 0;
  async function loadNewRound(){
    const myToken = ++roundToken;
    clearError();
    resetPanel();
    setLoading(true);
    try{
      const obs = await fetchRandomObservation();
      if(myToken !== roundToken) return; // a newer round request superseded this one
      const detail = await fetchTaxonDetail(obs.taxon.id);
      if(myToken !== roundToken) return;
      const chain = buildChain(detail);
      if(chain.length < 2) throw new Error("Incomplete taxonomy, trying another…");

      state = {
        obs, detail, chain,
        fullByRank: buildFullByRank(detail),
        bestIdx: -1,
        revealIdx: -1,
        guesses: 0,
        finished: false,
      };

      renderPhoto(obs).then(() => {
        // The photo's had first claim on the network; only now do we start
        // the (low-priority) sound lookups, so a slow connection spends its
        // bandwidth on the image first and the audio candidates second.
        if(myToken === roundToken) loadSoundForRound(detail.id, detail.name);
      });
      renderLadder();
      el.feed.innerHTML = "";
      el.bestLine.textContent = "Guess to narrow down the branches.";
      el.revealDetails.classList.remove("show");
      el.revealDetails.open = true;
      setLoading(false);
    }catch(e){
      if(myToken !== roundToken) return;
      console.error(e);
      showError("Trouble reaching iNaturalist — " + e.message + " Trying again…");
      setTimeout(() => { if(myToken === roundToken) loadNewRound(); }, 1200);
    }
  }

  function updateAdvanceButton(){
    if(state && state.finished){
      el.advanceBtn.textContent = "Next bird →";
      el.advanceBtn.classList.add("is-next");
      el.advanceBtn.classList.remove("is-reveal");
    }else{
      el.advanceBtn.textContent = "Reveal species";
      el.advanceBtn.classList.add("is-reveal");
      el.advanceBtn.classList.remove("is-next");
    }
  }

  function resetPanel(){
    el.guessInput.value = "";
    el.guessInput.disabled = true;
    el.guessBtn.disabled = true;
    el.pickBtn.disabled = true;
    el.advanceBtn.disabled = true;
    stopBirdSound();
    setSoundButtonState("loading");
    // Note: this runs before `state` is replaced with the new round's state
    // object, so we can't rely on updateAdvanceButton() reading state.finished
    // here — it would still see the just-finished previous round. Force it.
    el.advanceBtn.textContent = "Reveal species";
    el.advanceBtn.classList.add("is-reveal");
    el.advanceBtn.classList.remove("is-next");
    el.photoCard.classList.remove("revealed");
  }

  function setLoading(isLoading){
    if(isLoading){
      el.skeleton.style.display = "block";
      el.creditText.textContent = "Loading observation from iNaturalist…";
    } else {
      el.skeleton.style.display = "none";
      el.guessInput.disabled = false;
      el.guessBtn.disabled = false;
      el.pickBtn.disabled = false;
      el.advanceBtn.disabled = false;
      el.guessInput.focus();
    }
  }

  function renderPhoto(obs){
    const url = photoUrl(obs);
    el.photoFrame.innerHTML = '<div class="skeleton" id="skeleton"></div>';
    mysteryFrameHTML = "";
    hoverToken++;
    return new Promise(resolve => {
      const img = new Image();
      img.alt = "Mystery bird observation";
      // Give the browser an explicit hint that this image should win any
      // contention over the sound-lookup requests below.
      img.fetchPriority = "high";
      img.onload = () => {
        el.photoFrame.innerHTML = "";
        el.photoFrame.appendChild(img);
        mysteryFrameHTML = el.photoFrame.innerHTML;
        resolve();
      };
      img.onerror = () => {
        loadNewRound();
        resolve(); // don't leave the sound lookup waiting forever on a dead photo
      };
      img.src = url;

      const login = (obs.user && (obs.user.name || obs.user.login)) || "unknown observer";
      const license = (obs.photos[0] && obs.photos[0].license_code) ? obs.photos[0].license_code.toUpperCase() : "© all rights reserved";
      el.creditText.textContent = `Observed by ${login} · ${license}`;
      el.creditLink.href = obs.uri || `https://www.inaturalist.org/observations/${obs.id}`;
    });
  }

  const LADDER_HIDDEN_RANKS = new Set(["kingdom", "phylum", "class"]);

  function renderLadder(){
    el.ladder.innerHTML = "";
    state.chain.forEach((node, i) => {
      if(LADDER_HIDDEN_RANKS.has(node.rank)) return;
      const div = document.createElement("div");
      div.className = "rung";
      div.dataset.idx = i;
      div.tabIndex = 0;
      div.innerHTML = `
        <div class="rung-marker"><span class="dot"></span><span class="tick"></span></div>
        <div class="rung-body">
          <span class="rk-label">${RANK_LABELS[node.rank] || node.rank}</span>
          <div class="rung-top">
            <span class="rk-name">••••••••</span>
            <span class="rk-flag">revealed</span>
          </div>
          <span class="rk-common"></span>
        </div>
      `;
      el.ladder.appendChild(div);
      div.addEventListener("mouseenter", () => { if(div.classList.contains("revealed")) scheduleTierGrid(node); });
      div.addEventListener("mouseleave", () => hideTierGrid());
      div.addEventListener("focus", () => { if(div.classList.contains("revealed")) showTierGrid(node); });
      div.addEventListener("blur", () => hideTierGrid());
    });
  }

  function updateLadderReveal(prevRevealIdx){
    const rungs = el.ladder.querySelectorAll(".rung");
    rungs.forEach((rung) => {
      const i = Number(rung.dataset.idx);
      const node = state.chain[i];
      if(!node) return;
      if(i <= state.revealIdx){
        const guessed = i <= state.bestIdx;
        rung.classList.add("revealed");
        rung.classList.toggle("auto", !guessed);
        rung.classList.toggle("order-hit", guessed && node.rank === "order");
        rung.classList.toggle("family-hit", guessed && node.rank === "family");
        rung.classList.toggle("genus-hit", guessed && node.rank === "genus");
        rung.classList.toggle("species-hit", guessed && node.rank === "species");
        rung.querySelector(".rk-name").textContent = node.name;
        rung.querySelector(".rk-common").textContent = node.common ? node.common : "";
        if(node.id) fetchTaxonPhotoGrid(node.id);
      }
    });
    if(state.bestIdx >= 0 && state.chain[state.bestIdx] && !LADDER_HIDDEN_RANKS.has(state.chain[state.bestIdx].rank)){
      const node = state.chain[state.bestIdx];
      el.bestLine.innerHTML = `You reached: <b>${RANK_LABELS[node.rank] || node.rank}</b> — ${node.common ? node.common + " · " : ""}<i>${node.name}</i>`;
    } else if(state.bestIdx >= 0){
      el.bestLine.textContent = "That's too broad — try narrowing to order, family, genus, or species.";
    } else {
      el.bestLine.textContent = "Make a guess to start climbing.";
    }
  }

  // ---------- tier hover: photo grid ----------
  function photoUrlAtSize(p, size){
    let url = p.url || p.medium_url || p.large_url || p.square_url || p.small_url;
    if(!url) return "";
    return url.replace(/(square|small|medium|large|original)\.(jpg|jpeg|png|gif)/i, `${size}.$2`);
  }

  function fetchTaxonPhotoGrid(taxonId){
    if(taxonPhotoCache[taxonId]) return taxonPhotoCache[taxonId];
    const promise = (async () => {
      try{
        const qs = new URLSearchParams({
          taxon_id: String(taxonId), photos: "true", quality_grade: "research",
          per_page: "12", order_by: "votes", order: "desc"
        });
        const data = await fetchJSON(`${API}/observations?${qs.toString()}`);
        const photos = (data.results || [])
          .filter(o => o.photos && o.photos.length)
          .map(o => o.photos[0])
          .filter(p => p.medium_url || p.square_url || p.url);
        // Warm the browser's image cache now, so when the grid is actually
        // shown on hover the <img> tags paint instantly instead of buffering.
        photos.forEach(p => { const img = new Image(); img.src = photoUrlAtSize(p, "medium"); });
        taxonPhotoResolved[taxonId] = photos;
        return photos;
      }catch(e){
        console.error(e);
        return [];
      }
    })();
    taxonPhotoCache[taxonId] = promise;
    return promise;
  }

  function renderTierGrid(node, photos){
    if(!photos.length){
      el.photoFrame.innerHTML = mysteryFrameHTML;
      return;
    }
    const cols = photos.length >= 9 ? 4 : 3;
    const rows = Math.ceil(photos.length / cols);
    const imgs = photos.map(p => {
      const src = photoUrlAtSize(p, "medium").replace(/"/g, "&quot;");
      return `<img src="${src}" alt="" loading="lazy">`;
    }).join("");
    const label = RANK_LABELS[node.rank] || node.rank;
    el.photoFrame.innerHTML = `
      <div class="tier-grid" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr);">${imgs}</div>
      <div class="tier-grid-label">${label} <i>${node.name}</i></div>
    `;
  }

  function showTierGrid(node){
    if(!node || !node.id) return;
    const myToken = ++hoverToken;
    if(!mysteryFrameHTML) mysteryFrameHTML = el.photoFrame.innerHTML;

    // Reveal already warmed this taxon in the background — paint instantly,
    // no skeleton, no network wait.
    const cached = taxonPhotoResolved[node.id];
    if(cached){
      renderTierGrid(node, cached);
      return;
    }

    el.photoFrame.innerHTML = '<div class="skeleton"></div>';
    fetchTaxonPhotoGrid(node.id).then(photos => {
      if(myToken !== hoverToken) return; // hovered away already
      renderTierGrid(node, photos);
    });
  }

  let tierHoverTimer = null;
  function scheduleTierGrid(node){
    clearTimeout(tierHoverTimer);
    // If we already have the images warmed, show them immediately — the
    // delay only exists to stop a fast mouse sweep across the ladder from
    // firing a fetch/skeleton for every rung it passes over.
    if(taxonPhotoResolved[node.id]){
      showTierGrid(node);
      return;
    }
    tierHoverTimer = setTimeout(() => showTierGrid(node), 90);
  }

  function hideTierGrid(){
    clearTimeout(tierHoverTimer);
    hoverToken++;
    if(mysteryFrameHTML) el.photoFrame.innerHTML = mysteryFrameHTML;
  }

  // ---------- taxon resolution + scoring ----------
  function normalizeToken(s){
    s = (s || "").toLowerCase();
    if(s.length > 3 && s.endsWith("s")) s = s.slice(0, -1);
    return s;
  }
  function tokenize(name){
    return (name || "").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  }
  function containsSubsequence(tokens, sub){
    for(let i = 0; i + sub.length <= tokens.length; i++){
      if(sub.every((s, j) => tokens[i + j] === s)) return true;
    }
    return false;
  }

  const FINE_RANKS = new Set(["genus", "subgenus", "species", "hybrid", "complex", "subspecies", "variety", "form"]);

  function rankLevelOf(taxon){
    if(typeof taxon.rank_level === "number") return taxon.rank_level;
    const idx = RANKS.indexOf(taxon.rank);
    return idx >= 0 ? (RANKS.length - idx) * 10 : 999;
  }

  function matchTier(query, taxon){
    const q = query.trim().toLowerCase();
    const common = (taxon.preferred_common_name || "").toLowerCase();
    const sci = (taxon.name || "").toLowerCase();
    if(common === q || sci === q) return 0;

    const qTokens = tokenize(query).map(normalizeToken);
    const commonTokens = tokenize(taxon.preferred_common_name).map(normalizeToken);
    const sciTokens = tokenize(taxon.name).map(normalizeToken);
    const qNorm = qTokens.join(" ");
    if(!qTokens.length) return 7;

    if(qNorm && (commonTokens.join(" ") === qNorm || sciTokens.join(" ") === qNorm)) return 0;

    if(qTokens.length > 1 && containsSubsequence(commonTokens, qTokens)) return 1;

    const commonHits = qTokens.filter(t => commonTokens.includes(t)).length;
    const sciHits = qTokens.filter(t => sciTokens.includes(t)).length;

    if(commonHits) return FINE_RANKS.has(taxon.rank) ? 3 : 2;
    if(sciHits) return 4;

    if(common.startsWith(q) || sci.startsWith(q)) return 5;
    if(common.includes(q) || sci.includes(q)) return 6;
    return 7;
  }

  async function searchTaxa(q, cladeId){
    const qs = new URLSearchParams({ q, is_active: "true", per_page: "20" });
    if(cladeId) qs.set("taxon_id", cladeId);
    const data = await fetchJSON(`${API}/taxa/autocomplete?${qs.toString()}`);
    return data.results || [];
  }

  function buildQueryAttempts(query){
    const words = query.trim().split(/\s+/).filter(Boolean);
    const attempts = [query.trim()];
    for(let i = 1; i < words.length; i++) attempts.push(words.slice(i).join(" "));
    if(words.length > 1) attempts.push(words[words.length - 1]);
    return [...new Set(attempts.filter(Boolean))];
  }

  function chainNodeAsTaxon(node){
    return { name: node.name, preferred_common_name: node.common, rank: node.rank };
  }

  function resolveAgainstChain(query){
    if(!state || !state.chain || !state.chain.length) return null;
    let bestNode = null, bestTier = Infinity, bestIdx = -1;
    state.chain.forEach((node, i) => {
      let tier = matchTier(query, chainNodeAsTaxon(node));
      // The species rung shows the parent species' common name, but the
      // actually-observed taxon can be a subspecies with a more specific
      // common name (e.g. "Common Australian White Ibis") — a guess close
      // to that name should still be credited for the species.
      if(i === state.chain.length - 1 && state.detail){
        const aliasTier = matchTier(query, state.detail);
        if(aliasTier < tier) tier = aliasTier;
      }
      if(tier < bestTier || (tier === bestTier && i > bestIdx)){
        bestTier = tier;
        bestNode = node;
        bestIdx = i;
      }
    });
    if(bestNode && bestTier <= 1){
      return { id: bestNode.id, name: bestNode.name, preferred_common_name: bestNode.common, rank: bestNode.rank, ancestor_ids: [] };
    }
    return null;
  }

  async function resolveGuess(query){
    const chainMatch = resolveAgainstChain(query);
    if(chainMatch) return chainMatch;

    const cladeIdSet = new Set(String(cladeId).split(",").map(Number));
    const attempts = buildQueryAttempts(query);
    let results = [];
    for(const attempt of attempts){
      results = await searchTaxa(attempt, cladeId);
      if(results.length) break;
      results = await searchTaxa(attempt, null);
      if(results.length) break;
    }
    if(!results.length) return null;

    const chain = state ? state.chain : null;
    const ranked = results
      .map((t, i) => ({ t, tier: matchTier(query, t), i, chainIdx: chain ? computeMatchIdx(chain, t) : -1 }))
      .sort((a, b) => a.tier - b.tier || b.chainIdx - a.chainIdx || rankLevelOf(a.t) - rankLevelOf(b.t) || a.i - b.i);

    const inClade = t => cladeIdSet.has(t.id) || (t.ancestor_ids || []).some(id => cladeIdSet.has(id));
    const best = ranked.find(r => inClade(r.t)) || ranked[0];
    if(!best || best.tier >= 7) return null;
    return best.t;
  }

  function computeMatchIdx(chain, guessTaxon){
    if(!guessTaxon) return -1;
    const guessIds = new Set(guessTaxon.ancestor_ids || []);
    guessIds.add(guessTaxon.id);
    let idx = -1;
    for(let i = 0; i < chain.length; i++){
      if(guessIds.has(chain[i].id)) idx = i;
    }
    return idx;
  }

  function feedbackFor(idx, exactSpecies){
    if(idx < 0) return { text:"Not even the same kingdom.", cls:"s-none" };
    const node = state.chain[idx];
    const rank = node ? node.rank : RANKS[idx];
    if(rank === "species") return exactSpecies
      ? { text:"Exact species.", cls:"s-100" }
      : { text:"Correct species.", cls:"s-100" };
    if(rank === "genus") return { text:"Correct genus.", cls:"s-genus" };
    if(rank === "family") return { text:"Correct family.", cls:"s-hi" };
    if(rank === "order") return { text:"Correct order.", cls:"s-mid" };
    if(rank === "class") return { text:"Correct class only.", cls:"s-lo" };
    return { text:"Barely related.", cls:"s-lo" };
  }

  // A fragment match only counts as a coherent "echo" — rather than the
  // guess just being the answer with a letter or two lopped off — if it
  // still leaves a meaningful chunk of the target word unknown. Missing
  // only the first/last letter (e.g. "oisy" vs "noisy") reveals nearly
  // the whole word and should not be treated as a hint.
  function isCoherentFuzzyMatch(word, fragment){
    if(word.length <= fragment.length) return false;
    const diff = word.length - fragment.length;
    if(diff < 3) return false;
    if(fragment.length / word.length > 0.6) return false;
    return word.endsWith(fragment) || word.startsWith(fragment);
  }

  function findNameEcho(query, chain){
    const qTokens = tokenize(query).map(normalizeToken);
    if(qTokens.length !== 1) return null;
    const q = qTokens[0];
    if(!q || q.length < 3) return null;
    for(let i = chain.length - 1; i >= 0; i--){
      const common = chain[i].common;
      if(!common) continue;
      const words = common.toLowerCase().split(/[^a-z]+/).filter(Boolean);
      for(const w of words){
        const nw = normalizeToken(w);
        if(nw === q) continue;
        if(isCoherentFuzzyMatch(nw, q)){
          return { node: chain[i], word: w };
        }
      }
    }
    return null;
  }

  function findSpeciesWordOverlap(query, speciesNode, achievedNode){
    if(!speciesNode || !speciesNode.common) return null;
    const qTokensRaw = tokenize(query).filter(w => w.length > 2);
    if(!qTokensRaw.length) return null;
    const qTokensArr = qTokensRaw.map(normalizeToken);
    const qTokens = new Set(qTokensArr);
    const achievedTokens = tokenize(achievedNode && achievedNode.common ? achievedNode.common : "").map(normalizeToken);
    const achievedSet = new Set(achievedTokens);
    const targetTokensRaw = tokenize(speciesNode.common);
    const targetTokens = targetTokensRaw.map(normalizeToken);

    if(qTokensArr.length > 1 && containsSubsequence(targetTokens, qTokensArr) && !containsSubsequence(achievedTokens, qTokensArr)){
      return qTokensRaw.join(" ");
    }

    for(let i = 0; i < targetTokens.length; i++){
      const w = targetTokens[i];
      if(qTokens.has(w) && !achievedSet.has(w)) return targetTokensRaw[i];
    }

    for(let i = 0; i < targetTokens.length; i++){
      const w = targetTokens[i];
      if(achievedSet.has(w)) continue;
      for(let j = 0; j < qTokensArr.length; j++){
        const q = qTokensArr[j];
        if(w.length > q.length && (w.endsWith(q) || w.startsWith(q))) return qTokensRaw[j];
      }
    }
    return null;
  }

  function rankTierName(rank){
    if(rank === "order") return "order";
    if(rank === "family") return "family";
    if(rank === "genus") return "genus";
    if(rank === "species") return "species";
    return null;
  }

  function addFeedItem(query, guessTaxon, idx){
    const li = document.createElement("li");
    const isExactSpecies = guessTaxon && idx === state.chain.length - 1 && guessTaxon.id === state.detail.id;
    let fb = feedbackFor(idx, isExactSpecies);
    let hasEcho = false;
    if(idx < 0){
      const echo = findNameEcho(query, state.chain);
      if(echo){
        hasEcho = true;
        const tier = rankTierName(echo.node.rank);
        const tierCls = tier ? ` tier-${tier}` : "";
        fb = {
          text: `<div class="echo-line"><span class="echo-badge${tierCls}">🔎 Name match</span>Not a taxonomic match — but it shares <mark class="echo-mark${tierCls}">${echo.word}</mark> with its ${RANK_LABELS[echo.node.rank] || echo.node.rank}.</div>`,
          cls: "s-none"
        };
      }
    } else if(!isExactSpecies){
      const speciesNode = state.chain[state.chain.length - 1];
      const overlapWord = findSpeciesWordOverlap(query, speciesNode, state.chain[idx]);
      if(overlapWord){
        hasEcho = true;
        fb = { text: `${fb.text}<div class="echo-line"><span class="echo-badge tier-species">🔎 Name match</span>Also close — the species name echoes <mark class="echo-mark tier-species">${overlapWord}</mark>.</div>`, cls: fb.cls };
      }
    }
    li.className = fb.cls + (hasEcho ? " has-echo" : "");
    const commonBit = guessTaxon
      ? `→ <b>${guessTaxon.preferred_common_name || guessTaxon.name}</b> <i>(${guessTaxon.name})</i> · ${fb.text}`
      : `→ no matching taxon found, try a different name${hasEcho ? fb.text : ""}`;
    li.innerHTML = `<span class="fq">"${query}"</span><span class="fm">${commonBit}</span>`;
    el.feed.prepend(li);
  }

  async function submitGuess(){
    const query = el.guessInput.value.trim();
    if(!query || !state || state.finished) return;
    el.guessBtn.disabled = true;
    el.guessInput.disabled = true;
    el.pickBtn.disabled = true;
    clearError();
    try{
      const guessTaxon = await resolveGuess(query);
      const prevRevealIdx = state.revealIdx;
      let idx = -1;
      if(guessTaxon){
        idx = computeMatchIdx(state.chain, guessTaxon);
      }
      state.guesses += 1;
      if(idx > state.bestIdx){
        state.bestIdx = idx;
        state.revealIdx = idx;
      }
      addFeedItem(query, guessTaxon, idx);
      updateLadderReveal(prevRevealIdx);

      const isSpeciesMatch = idx === state.chain.length - 1;
      if(isSpeciesMatch){
        finishRound(true);
      }
    }catch(e){
      console.error(e);
      showError("Couldn't look up that guess — check your connection and try again.");
    }finally{
      el.guessInput.value = "";
      if(state && !state.finished){
        el.guessBtn.disabled = false;
        el.guessInput.disabled = false;
        el.pickBtn.disabled = false;
        el.guessInput.focus();
      }
    }
  }

  function stripHtml(html){
    const div = document.createElement("div");
    div.innerHTML = html || "";
    return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
  }

  function truncate(text, max){
    if(text.length <= max) return text;
    const cut = text.slice(0, max);
    return cut.slice(0, cut.lastIndexOf(" ")) + "…";
  }

  function isUsableSimilarSpecies(t){
    return !!t && t.rank === "species" && !t.extinct && t.is_active !== false;
  }

  async function fetchSimilarSpecies(detail){
    const genusNode = detail.rank === "genus" ? detail : (detail.ancestors || []).find(a => a.rank === "genus");
    if(!genusNode) return [];
    try{
      const data = await fetchJSON(`${API}/taxa/${genusNode.id}`);
      const genusDetail = data.results && data.results[0];
      const genusMates = (genusDetail && genusDetail.children || [])
        .filter(c => c.id !== detail.id && isUsableSimilarSpecies(c))
        .sort((a, b) => (b.observations_count || 0) - (a.observations_count || 0));

      if(genusMates.length) return genusMates.slice(0, 3);

      // Monotypic (or all-extinct) genus, e.g. Trumpet Manucode is the only
      // living Phonygammus — widen the search to sibling genera in the same
      // family and pull each one's most-recorded species as a stand-in for
      // "commonly confused with."
      const familyNode = detail.rank === "family" ? detail : (detail.ancestors || []).find(a => a.rank === "family");
      if(!familyNode) return [];
      const familyData = await fetchJSON(`${API}/taxa/${familyNode.id}`);
      const familyDetail = familyData.results && familyData.results[0];
      const genusSiblings = (familyDetail && familyDetail.children || [])
        .filter(g => g.id !== genusNode.id && g.rank === "genus" && !g.extinct && g.is_active !== false)
        .sort((a, b) => (b.observations_count || 0) - (a.observations_count || 0))
        .slice(0, 6);

      const picks = [];
      for(const g of genusSiblings){
        if(picks.length >= 3) break;
        try{
          const gData = await fetchJSON(`${API}/taxa/${g.id}`);
          const gDetail = gData.results && gData.results[0];
          const best = (gDetail && gDetail.children || [])
            .filter(isUsableSimilarSpecies)
            .sort((a, b) => (b.observations_count || 0) - (a.observations_count || 0))[0];
          if(best) picks.push(best);
        }catch(e){ /* skip this genus, try the next */ }
      }
      return picks;
    }catch(e){
      console.error(e);
      return [];
    }
  }

  function soundLineHTML(){
    const soundCandidate = state && state.sound && state.sound.candidates[state.sound.index];
    if(!soundCandidate || !soundCandidate.uri) return "";
    const label = soundCandidate.publisher ? `Audio recording (${soundCandidate.publisher})` : "Audio recording";
    return `${label}: <a href="${soundCandidate.uri}" target="_blank" rel="noopener">View source ↗</a>`;
  }

  function refreshRevealSoundLine(){
    const lineEl = document.getElementById("revealSoundLine");
    if(!lineEl) return;
    const html = soundLineHTML();
    lineEl.innerHTML = html;
    lineEl.style.display = html ? "" : "none";
  }

  function renderRevealDetails(state, solved){
    const detail = state.detail;

    const headline = `<div class="reveal-headline">
          <div class="rh-name">${detail.preferred_common_name || detail.name}</div>
          <div class="rh-sci">${detail.name}</div>
        </div>`;

    const aboutText = detail.wikipedia_summary ? truncate(stripHtml(detail.wikipedia_summary), 420) : "";
    const about = aboutText
      ? `<div class="reveal-section">
          <h3>About</h3>
          <div class="reveal-about">${aboutText}${detail.wikipedia_url ? ` <a href="${detail.wikipedia_url}" target="_blank" rel="noopener">Wikipedia ↗</a>` : ""}</div>
        </div>`
      : "";

    const soundHTML = soundLineHTML();

    el.revealBox.innerHTML = `
      <div class="reveal-score">${solved
        ? `Solved in ${state.guesses} guess${state.guesses === 1 ? "" : "es"}.`
        : `Answer revealed.`
      } <a href="${state.obs.uri}" target="_blank" rel="noopener">View this observation ↗</a></div>
      <div class="reveal-score" id="revealSoundLine" style="${soundHTML ? "" : "display:none;"}">${soundHTML}</div>
      ${headline}
      ${about}
      <div class="reveal-section" id="similarSection">
        <h3>Similar species</h3>
        <div class="reveal-note">Looking up other species in the same genus…</div>
      </div>
    `;

    fetchSimilarSpecies(detail).then(similar => {
      const section = document.getElementById("similarSection");
      if(!section) return;
      if(!similar.length){
        section.innerHTML = `<h3>Similar species</h3><div class="reveal-note">No other species on record in this genus or family.</div>`;
        return;
      }
      const cards = similar.map(s => {
        const p = s.default_photo;
        const thumb = p ? (p.small_url || p.medium_url || p.square_url || p.url) : "";
        const img = thumb ? `<img src="${thumb.replace(/"/g, '&quot;')}" alt="" loading="lazy">` : "";
        return `<a class="similar-card" href="https://www.inaturalist.org/taxa/${s.id}" target="_blank" rel="noopener">
          ${img}
          <div class="sc-label">${s.preferred_common_name || s.name}<i>${s.name}</i></div>
        </a>`;
      }).join("");
      section.innerHTML = `<h3>Similar species</h3><div class="similar-grid">${cards}</div>`;
    });
  }

  function finishRound(solved){
    if(!state || state.finished) return;
    state.finished = true;

    const prevRevealIdx = state.revealIdx;
    state.revealIdx = state.chain.length - 1;
    updateLadderReveal(prevRevealIdx);

    // Dynamic Summary Text
    const name = state.detail.preferred_common_name || state.detail.name;
    el.revealSummary.textContent = solved ? `Solved: ${name}` : `Revealed: ${name}`;

    el.revealDetails.classList.add("show");
    renderRevealDetails(state, solved);

    el.photoCard.classList.add("revealed");

    el.guessInput.disabled = true;
    el.guessBtn.disabled = true;
    el.pickBtn.disabled = true;
    el.advanceBtn.disabled = false;
    updateAdvanceButton();
    closePickOverlay();

    setTimeout(() => el.advanceBtn.focus(), 0);
  }

  // ---------- pick-me (multiple choice) ----------
  const PICK_RANKS = ["order", "family", "genus", "species"];
  let pickBusyId = 0; 

  function rankIndexInRanks(rank){ return RANKS.indexOf(rank); }

  function immediateParentRank(rank){
    const i = rankIndexInRanks(rank);
    return i > 0 ? RANKS[i - 1] : null;
  }

  function dedupeById(list){
    const seen = new Set(), out = [];
    list.forEach(t => { if(t && !seen.has(t.id)){ seen.add(t.id); out.push(t); } });
    return out;
  }

  async function fetchRankChildren(ancestorId, rank){
    try{
      const qs = new URLSearchParams({ taxon_id: String(ancestorId), rank, per_page: "40", is_active: "true" });
      const data = await fetchJSON(`${API}/taxa?${qs.toString()}`);
      return data.results || [];
    }catch(e){ return []; }
  }

  async function fetchPickPool(rank, correctId){
    // Only look within the immediate parent taxon (e.g. genus options come only
    // from the correct family). Climbing further up the tree pulls in siblings
    // from unrelated families/orders, which is misleading.
    const parentRank = immediateParentRank(rank);
    if(!parentRank) return [];
    const anchorNode = state.chain.find(n => n.rank === parentRank);
    if(!anchorNode) return [];
    const children = await fetchRankChildren(anchorNode.id, rank);
    return dedupeById(children);
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = rnd(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickCellPhoto(taxon){
    const p = taxon.default_photo;
    return p ? (p.medium_url || p.small_url || p.square_url || p.url) : "";
  }

  function renderPickStatus(text){
    el.pickBody.innerHTML = `<div class="pick-status">${text}</div>`;
  }

  function setPickProgress(rank){
    const stepNum = PICK_RANKS.indexOf(rank) + 1;
    el.pickProgress.innerHTML = `Step <b>${stepNum}</b> of ${PICK_RANKS.length}`;
  }

  function nextUnresolvedPickRank(){
    for(const rank of PICK_RANKS){
      const idx = state.chain.findIndex(n => n.rank === rank);
      if(idx === -1) continue;
      if(idx > state.bestIdx) return rank;
    }
    return null;
  }

  function openPickOverlay(){
    el.pickOverlay.classList.add("show");
    if(state && state.obs){
      const url = photoUrl(state.obs);
      if(url) el.pickPhotoImg.src = url;
    }
    el.guessBtn.disabled = true;
    el.guessInput.disabled = true;
    el.pickBtn.disabled = true;
    el.advanceBtn.disabled = true;
  }

  function closePickOverlay(){
    el.pickOverlay.classList.remove("show");
    pickBusyId++; 
    if(state && !state.finished){
      el.guessBtn.disabled = false;
      el.guessInput.disabled = false;
      el.pickBtn.disabled = false;
      el.advanceBtn.disabled = false;
    }
  }

  async function startPickMe(){
    if(!state || state.finished) return;
    const rank = nextUnresolvedPickRank();
    if(!rank){
      finishRound(false);
      return;
    }
    openPickOverlay();
    await openPickGrid(rank);
  }

  function setSupracladeLabel(rank){
    const idx = RANKS.indexOf(rank);
    const supraRank = idx > 0 ? RANKS[idx - 1] : null;
    const supraTaxon = supraRank ? state.fullByRank[supraRank] : null;
    if(supraTaxon){
      el.pickSupraclade.innerHTML = `<p class="ps-rank">${RANK_LABELS[supraRank]}</p><h3 class="ps-name">${supraTaxon.name}</h3>`;
    }else{
      el.pickSupraclade.innerHTML = "";
    }
  }

  async function openPickGrid(rank){
    const myId = ++pickBusyId;
    el.pickEyebrow.textContent = "Multiple choice";
    el.pickTitle.textContent = `Pick the ${rank}`;
    setPickProgress(rank);
    renderPickStatus("Gathering candidates…");

    const correctFull = state.fullByRank[rank];
    if(!correctFull){
      renderPickStatus("Couldn't find enough taxonomic data for this rank.");
      return;
    }
    setSupracladeLabel(rank);

    let pool;
    try{
      pool = await fetchPickPool(rank, correctFull.id);
    }catch(e){
      pool = [];
    }
    if(myId !== pickBusyId) return;

    const wrongPool = shuffle(pool.filter(t => t.id !== correctFull.id)).slice(0, 8);
    const options = shuffle([correctFull, ...wrongPool]);

    if(options.length < 2){
      // No genuine choice exists at this rank within its correct parent
      // (e.g. a family with only one genus) — auto-resolve it and move on,
      // rather than reaching outside the correct lineage for filler options.
      autoResolveRank(rank, correctFull);
      return;
    }

    const grid = document.createElement("div");
    grid.className = "pick-grid";
    options.forEach(taxon => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pick-cell";
      const photo = pickCellPhoto(taxon);
      const label = taxon.preferred_common_name || taxon.name;
      const sci = taxon.name;
      btn.innerHTML = `
        ${photo ? `<img src="${photo.replace(/"/g, "&quot;")}" alt="" loading="lazy">` : `<div style="flex:1;min-height:0;background:var(--surface-2);"></div>`}
        <div class="pc-label">${label}${label !== sci ? `<i>${sci}</i>` : ""}</div>
      `;
      btn.addEventListener("click", () => handlePickChoice(rank, taxon, correctFull.id, btn));
      grid.appendChild(btn);
    });
    el.pickBody.innerHTML = "";
    el.pickBody.appendChild(grid);
  }

  function autoResolveRank(rank, correctFull){
    if(!state || state.finished) return;
    const idx = state.chain.findIndex(n => n.rank === rank);
    const prevRevealIdx = state.revealIdx;
    if(idx > state.bestIdx){
      state.bestIdx = idx;
      state.revealIdx = idx;
    }
    addFeedItem(correctFull.preferred_common_name || correctFull.name, correctFull, idx);
    updateLadderReveal(prevRevealIdx);

    const isSpeciesMatch = idx === state.chain.length - 1;
    if(isSpeciesMatch){
      closePickOverlay();
      finishRound(true);
    }else{
      const nextRank = nextUnresolvedPickRank();
      if(nextRank) openPickGrid(nextRank);
      else { closePickOverlay(); finishRound(true); }
    }
  }

  function handlePickChoice(rank, taxon, correctId, btnEl){
    if(!state || state.finished) return;
    if(taxon.id !== correctId){
      btnEl.classList.add("wrong");
      btnEl.disabled = true;
      return;
    }

    el.pickBody.querySelectorAll(".pick-cell").forEach(c => { c.disabled = true; });
    btnEl.classList.add("correct");

    const idx = state.chain.findIndex(n => n.rank === rank);
    const prevRevealIdx = state.revealIdx;
    state.guesses += 1;
    if(idx > state.bestIdx){
      state.bestIdx = idx;
      state.revealIdx = idx;
    }
    addFeedItem(taxon.preferred_common_name || taxon.name, taxon, idx);
    updateLadderReveal(prevRevealIdx);

    const isSpeciesMatch = idx === state.chain.length - 1;
    setTimeout(() => {
      if(!state || state.finished) return;
      if(isSpeciesMatch){
        closePickOverlay();
        finishRound(true);
      }else{
        const nextRank = nextUnresolvedPickRank();
        if(nextRank) openPickGrid(nextRank);
        else { closePickOverlay(); finishRound(true); }
      }
    }, 650);
  }

  // ---------- gamemode selector ----------
  function populateGamemodeSelect(){
    GAMEMODES.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.label;
      el.gamemodeSelect.appendChild(opt);
    });
    if(!gamemode){
      const opt = document.createElement("option");
      opt.value = "__url__";
      opt.textContent = "{ From link }";
      opt.selected = true;
      el.gamemodeSelect.insertBefore(opt, el.gamemodeSelect.firstChild);
    }else{
      el.gamemodeSelect.value = gamemode.id;
    }
  }

  function onGamemodeChange(){
    const val = el.gamemodeSelect.value;
    if(val === "__url__") return;
    gamemode = GAMEMODES.find(m => m.id === val) || GAMEMODES[0];
    cladeId = gamemode.q;

    const url = new URL(location.href);
    url.searchParams.set("mode", gamemode.id);
    url.searchParams.delete("taxon_id");
    history.replaceState(null, "", url);

    loadNewRound();
  }

  // ---------- region / place selector ----------
  function populateRegionSelect(){
    REGIONS.slice(1).forEach(r => {
      const opt = document.createElement("option");
      opt.value = r.q;
      opt.textContent = r.label;
      el.regionSelect.appendChild(opt);
    });
    if(placeId){
      const opt = document.createElement("option");
      opt.value = "__url__";
      opt.textContent = "{ From link }";
      opt.selected = true;
      el.regionSelect.insertBefore(opt, el.regionSelect.firstChild.nextSibling);
    }
  }

  async function resolvePlaceId(name){
    if(placeIdCache[name]) return placeIdCache[name];
    const qs = new URLSearchParams({ q: name, per_page: "8" });
    const data = await fetchJSON(`${API}/places/autocomplete?${qs.toString()}`);
    const results = data.results || [];
    if(!results.length) return null;
    const exact = results.find(p => (p.name || "").toLowerCase() === name.toLowerCase());
    const id = (exact || results[0]).id;
    placeIdCache[name] = id;
    return id;
  }

  async function onRegionChange(){
    const val = el.regionSelect.value;
    if(val === "__url__") return;
    el.regionSelect.disabled = true;
    el.regionStatus.textContent = "";
    if(!val){
      placeId = null;
    }else{
      el.regionStatus.textContent = "finding region…";
      try{
        const id = await resolvePlaceId(val);
        if(!id){
          showError(`Couldn't find "${val}" as an iNaturalist place — showing everywhere instead.`);
          placeId = null;
          el.regionSelect.value = "";
        }else{
          placeId = id;
        }
      }catch(e){
        console.error(e);
        showError("Couldn't reach iNaturalist to resolve that region.");
        placeId = null;
        el.regionSelect.value = "";
      }
    }
    el.regionStatus.textContent = "";
    el.regionSelect.disabled = false;

    const url = new URL(location.href);
    if(placeId) url.searchParams.set("place_id", placeId); else url.searchParams.delete("place_id");
    history.replaceState(null, "", url);

    loadNewRound();
  }

  // ---------- events ----------
  el.guessBtn.addEventListener("click", submitGuess);
  el.guessInput.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submitGuess(); } });
  el.advanceBtn.addEventListener("click", () => {
    if(!state) return;
    if(state.finished){ loadNewRound(); }
    else{ finishRound(false); }
  });
  el.pickBtn.addEventListener("click", startPickMe);
  el.soundBtn.addEventListener("click", toggleBirdSound);
  el.pickCloseBtn.addEventListener("click", closePickOverlay);
  el.pickRevealBtn.addEventListener("click", () => { closePickOverlay(); finishRound(false); });
  el.gamemodeSelect.addEventListener("change", onGamemodeChange);
  el.regionSelect.addEventListener("change", onRegionChange);
  el.difficultySlider.addEventListener("input", () => {
    difficulty = Number(el.difficultySlider.value);
    updateDifficultyLabel();
  });

  // ---------- difficulty label ----------
  function updateDifficultyLabel(){
    const v = difficulty;
    let text;
    if(v === 50) text = "Balanced mix";
    else if(v < 50) text = (50 - v) > 30 ? "Strongly favors common" : "Favors common";
    else text = (v - 50) > 30 ? "Strongly favors rare" : "Favors rare";
    el.difficultyLabel.textContent = text;
  }

  populateGamemodeSelect();
  populateRegionSelect();
  updateDifficultyLabel();
  loadNewRound();
})();
</script>
</body>
</html>
