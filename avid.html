<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvID — Bird Identification Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="home-link">← gompk!</a>
    <h1><i>Av</i>ID</h1>
  </header>

  <main class="game-container">
    <div class="card photo-card">
      <div class="photo-frame" id="photoFrame">
        <div class="skeleton" id="skeleton"></div>
        <img id="obsPhoto" alt="Bird observation photo" src="" style="display: none;" />
        
        <!-- Minimap Overlay (Top-Left) -->
        <div class="minimap-card" id="minimapCard" aria-label="Observation Location Map">
          <img id="minimapImg" alt="Map tile" src="" />
        </div>
      </div>

      <!-- Corner Control Buttons (Top-Right) -->
      <button class="back-corner" id="backBtn" disabled title="Previous observation" aria-label="Previous observation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <button class="sound-corner" id="soundBtn" title="Play audio call" aria-label="Play audio call">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </div>

    <div class="controls">
      <div id="ladder" class="ladder-container"></div>
      <div id="feed" class="feed-container"></div>
      <div id="bestLine" class="best-line"></div>
      <button id="advanceBtn" class="primary-btn">Next Bird</button>
    </div>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
